[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-reading-core"
version = "0.1.0"
description = "Shared Japanese tokenization and contextual reading engines for Bunomi and Utayomi"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "qwei" }]
dependencies = [
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "pykakasi>=2.2.1",
  "sudachipy>=0.6.11",
  "sudachidict-core>=20230110",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
