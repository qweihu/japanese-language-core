[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-language-core"
version = "0.4.0"
description = "Reusable Japanese language capabilities: contextual reading, kana/romaji, deinflection, line-preserving translation contracts, dictionary metadata, grammar patterns, and export utilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qwei" }]
dependencies = []

[project.optional-dependencies]
reading = [
  "sudachipy>=0.6.11",
  "sudachidict-core>=20230110",
]
pykakasi = [
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "pykakasi>=2.2.1",
]
translation = []
all = [
  "sudachipy>=0.6.11",
  "sudachidict-core>=20230110",
]

[project.scripts]
nihongo = "japanese_language_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
japanese_language_core = ["translation/data/*.json"]
